<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Coding Bird architecture overview</title><desc id="desc">Conceptual diagram showing browser, Next.js and tRPC, shared packages, PostgreSQL and storage, Hocuspocus collaboration, and isolated code judge.</desc>
<defs><style>.bg{fill:#0b1020}.panel{fill:#151f35;stroke:#6682b8;stroke-width:2}.edge{stroke:#a7c4ff;stroke-width:3;fill:none}.title{fill:#fff;font:700 30px sans-serif}.head{fill:#dce8ff;font:700 19px sans-serif}.body{fill:#b8c7e3;font:15px sans-serif}.small{fill:#9fb3d7;font:13px sans-serif}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6Z" fill="#a7c4ff"/></marker></defs>
<rect class="bg" width="1200" height="680" rx="24"/><text class="title" x="56" y="62">Coding Bird · Conceptual System Architecture</text>
<rect class="panel" x="60" y="125" width="230" height="160" rx="16"/><text class="head" x="84" y="165">Browser clients</text><text class="body" x="84" y="198">Next.js UI</text><text class="body" x="84" y="224">Editors + WebContainer</text><text class="body" x="84" y="250">System Design canvas</text>
<rect class="panel" x="390" y="110" width="270" height="190" rx="16"/><text class="head" x="420" y="150">Next.js + tRPC</text><text class="body" x="420" y="184">Session and authorization</text><text class="body" x="420" y="210">Domain routers</text><text class="body" x="420" y="236">Submission orchestration</text><text class="body" x="420" y="262">Server-side validation</text>
<rect class="panel" x="790" y="90" width="330" height="150" rx="16"/><text class="head" x="820" y="130">Shared packages</text><text class="body" x="820" y="164">Auth · API · DB · Storage</text><text class="body" x="820" y="190">Validators · Ducklet FS · Content</text>
<rect class="panel" x="790" y="300" width="330" height="120" rx="16"/><text class="head" x="820" y="340">PostgreSQL</text><text class="body" x="820" y="374">Users · rooms · submissions · attempts</text>
<rect class="panel" x="390" y="390" width="270" height="120" rx="16"/><text class="head" x="420" y="430">Hocuspocus</text><text class="body" x="420" y="464">Y.js WebSocket sync</text><text class="body" x="420" y="488">Room-scoped authorization</text>
<rect class="panel" x="60" y="390" width="230" height="120" rx="16"/><text class="head" x="84" y="430">External judge</text><text class="body" x="84" y="464">Isolated code execution</text><text class="body" x="84" y="488">Resource limits required</text>
<rect class="panel" x="790" y="480" width="330" height="100" rx="16"/><text class="head" x="820" y="520">Object storage</text><text class="body" x="820" y="550">R2 / S3-compatible blobs</text>
<path class="edge" marker-end="url(#arrow)" d="M290 205 H390"/><path class="edge" marker-end="url(#arrow)" d="M660 195 H790"/><path class="edge" marker-end="url(#arrow)" d="M955 240 V300"/><path class="edge" marker-end="url(#arrow)" d="M390 450 H290"/><path class="edge" marker-end="url(#arrow)" d="M175 390 V285"/><path class="edge" marker-end="url(#arrow)" d="M660 450 H740 V360 H790"/><path class="edge" marker-end="url(#arrow)" d="M955 420 V480"/>
<text class="small" x="56" y="630">Conceptual view only. Deployment topology, network policy, and isolation controls must be verified separately.</text></svg>