<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Coding Bird security trust boundaries</title><desc id="desc">Untrusted browser input crosses validated and authorized application boundaries before reaching private data, realtime services, storage, and isolated judge workers.</desc>
<defs><style>.bg{fill:#101827}.box{fill:#1b2940;stroke:#76a4d9;stroke-width:2}.risk{fill:#3a202b;stroke:#e78b9a;stroke-width:2}.good{fill:#17382f;stroke:#75c9a4;stroke-width:2}.h{fill:#fff;font:700 20px sans-serif}.t{fill:#d2deef;font:15px sans-serif}.n{fill:#9eb1cc;font:13px sans-serif}.line{stroke:#b6d0f5;stroke-width:3;fill:none}</style><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6Z" fill="#b6d0f5"/></marker></defs>
<rect class="bg" width="1200" height="600" rx="22"/><text class="h" x="48" y="55" font-size="29">Trust boundaries · conceptual security map</text>
<rect class="risk" x="45" y="130" width="230" height="300" rx="18"/><text class="h" x="75" y="175">Untrusted inputs</text><text class="t" x="75" y="220">Browser requests</text><text class="t" x="75" y="252">User source code</text><text class="t" x="75" y="284">HTML / CSS / scripts</text><text class="t" x="75" y="316">Uploads and URLs</text><text class="n" x="75" y="385">Validate every input</text>
<rect class="box" x="350" y="130" width="260" height="300" rx="18"/><text class="h" x="380" y="175">Application boundary</text><text class="t" x="380" y="220">Authentication</text><text class="t" x="380" y="252">Resource authorization</text><text class="t" x="380" y="284">Schema validation</text><text class="t" x="380" y="316">Rate / size limits</text><text class="n" x="380" y="385">Fail closed on denial</text>
<rect class="good" x="690" y="75" width="450" height="130" rx="18"/><text class="h" x="720" y="120">Private data services</text><text class="t" x="720" y="158">PostgreSQL · R2 / S3</text><text class="n" x="720" y="185">Least privilege · ownership checks · retention</text>
<rect class="good" x="690" y="245" width="450" height="130" rx="18"/><text class="h" x="720" y="290">Realtime collaboration</text><text class="t" x="720" y="328">Room-scoped signed token · verified identity · role enforcement</text><text class="n" x="720" y="355">Re-check membership at connect time</text>
<rect class="risk" x="690" y="415" width="450" height="130" rx="18"/><text class="h" x="720" y="460">Isolated execution boundary</text><text class="t" x="720" y="498">Judge workers · preview renderer</text><text class="n" x="720" y="525">CPU / memory / time / filesystem / network controls</text>
<path class="line" marker-end="url(#arr)" d="M275 280 H350"/><path class="line" marker-end="url(#arr)" d="M610 220 H650 V140 H690"/><path class="line" marker-end="url(#arr)" d="M610 280 H690"/><path class="line" marker-end="url(#arr)" d="M610 350 H650 V480 H690"/>
<text class="n" x="48" y="580">Diagram expresses intended trust boundaries, not proof of current production configuration.</text></svg>