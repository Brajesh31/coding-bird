<title id="t">Coding Bird CI pipeline</title><desc id="d">Current GitHub workflow has three parallel jobs: lint, format check, and typecheck.</desc>
<defs><style>.bg{fill:#0d172b}.box{fill:#182d4b;stroke:#71a9df;stroke-width:2}.txt{fill:#e6efff;font:bold 20px Arial}.sub{fill:#afc3e1;font:15px Arial}.line{stroke:#8fc5ff;stroke-width:3;fill:none}</style><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6Z" fill="#8fc5ff"/></marker></defs>
