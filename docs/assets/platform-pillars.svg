<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
<title id="t">Coding Bird product pillars</title><desc id="d">Four product areas: algorithmic problems, realtime collaboration, system design simulation, and machine coding.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111a31"/><stop offset="1" stop-color="#263d68"/></linearGradient></defs><rect width="1200" height="560" rx="24" fill="url(#bg)"/>
<text x="55" y="72" fill="#fff" font-size="34" font-family="Arial" font-weight="700">Four ways to practice engineering</text>
<g font-family="Arial">
<rect x="55" y="120" width="520" height="160" rx="20" fill="#162b4a" stroke="#4da7d7" stroke-width="2"/><text x="90" y="172" fill="#9de5ff" font-size="30" font-weight="700">01 · Problems</text><text x="90" y="218" fill="#d5e4f8" font-size="19">Write solutions across multiple languages.</text><text x="90" y="250" fill="#a9bddb" font-size="15">Generated drivers · external judge · verdicts</text>
<rect x="625" y="120" width="520" height="160" rx="20" fill="#20244d" stroke="#9e87e6" stroke-width="2"/><text x="660" y="172" fill="#c8b7ff" font-size="30" font-weight="700">02 · Collaborative Rooms</text><text x="660" y="218" fill="#d5e4f8" font-size="19">Edit and communicate together in realtime.</text><text x="660" y="250" fill="#a9bddb" font-size="15">Y.js · Hocuspocus · shared workspace</text>
<rect x="55" y="320" width="520" height="160" rx="20" fill="#163a3d" stroke="#51c5b4" stroke-width="2"/><text x="90" y="372" fill="#9cf0df" font-size="30" font-weight="700">03 · System Design</text><text x="90" y="418" fill="#d5e4f8" font-size="19">Explore architecture trade-offs with simulation.</text><text x="90" y="450" fill="#a9bddb" font-size="15">Typed blocks · deterministic engine · scoring</text>
<rect x="625" y="320" width="520" height="160" rx="20" fill="#423329" stroke="#d6a66e" stroke-width="2"/><text x="660" y="372" fill="#ffdaa9" font-size="30" font-weight="700">04 · Machine Coding</text><text x="660" y="418" fill="#d5e4f8" font-size="19">Build frontend components against requirements.</text><text x="660" y="450" fill="#a9bddb" font-size="15">Starter projects · browser tests · practice</text>
</g></svg>