name: "📚 Documentation improvement"
description: Report unclear, missing, or outdated documentation.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Documentation area
      options:
        - README / setup
        - Architecture / diagrams
        - API / database
        - Security / operations
        - Contributing / governance
        - Other
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: File or section
      description: Link the relevant page or heading.
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is unclear or incorrect?
    validations:
      required: true
  - type: textarea
    id: suggested
    attributes:
      label: Suggested improvement
  - type: checkboxes
    id: verification
    attributes:
      label: Verification
      options:
        - label: I checked whether the information is already documented elsewhere.
          required: true
